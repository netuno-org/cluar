<!doctype html>
<html lang="en">
 <head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="/images/favicon.png?v=1786662115936">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <meta name="keywords" content="">
  <meta name="description" content="">
  <link rel="manifest" href="/manifest.json">
  <title>Cluar CMS</title>
  <script>
    (function () {
      var savedTheme = localStorage.getItem('theme') || 'light';
      document.documentElement.setAttribute('data-theme', savedTheme);

      document.documentElement.style.backgroundColor =
        savedTheme === 'light' ? '#ffffff' : '#000000';
      document.body.style.backgroundColor =
        savedTheme === 'light' ? '#ffffff' : '#000000';
    })();
  </script>
  <style>
    :root {
      /*
       * Valores por omissão (fallback). São substituídos pelo bloco
       * <link id="cluar-configuration"> (root.css) logo abaixo, gerado a partir
       * das Configurações (título, cor primária/loading e cores de fundo).
       * Ver server/core/cluar/base.js -> cluar.base.applyConfigurationToIndexHtml
       */
      --cluar-loading-color: #1178FF;
      --cluar-bg-light: #ffffff;
      --cluar-bg-dark: #000000;
    }

    body {
      background-color: var(--body-bg, #ffffff);
    }

    html[data-theme="light"] body {
      --body-bg: var(--cluar-bg-light);
    }

    html[data-theme="dark"] body {
      --body-bg: var(--cluar-bg-dark);
    }

    .base-loading__container {
      padding-top: calc((100vh / 2) - 90px);
      width: 250px;
      margin-left: auto;
      margin-right: auto;
      text-align: center;
    }

    .base-loading {
      display: inline-block;
      position: relative;
      width: 80px;
      height: 80px;
    }

    .base-loading div {
      display: inline-block;
      position: absolute;
      left: 8px;
      width: 16px;
      background: var(--cluar-loading-color);
      animation: base-loading 1.2s cubic-bezier(0, 0.5, 0.5, 1) infinite;
    }

    .base-loading div:nth-child(1) {
      left: 8px;
      animation-delay: -0.24s;
    }

    .base-loading div:nth-child(2) {
      left: 32px;
      animation-delay: -0.12s;
    }

    .base-loading div:nth-child(3) {
      left: 56px;
      animation-delay: 0;
    }

    @keyframes base-loading {
      0% {
        top: 8px;
        height: 64px;
      }

      50%,
      100% {
        top: 24px;
        height: 32px;
      }
    }
  </style>
  <!--
    root.css é reescrito automaticamente pelo servidor (cluar.build) com
    as cores das Configurações. É sempre o MESMO ficheiro/URL para todas
    as páginas - por isso uma gravação de configuração nunca precisa de
    tocar em cada página já publicada, só substitui este ficheiro.
    Ver cluar.base.applyConfigurationToIndexHtml.
  -->
  <link id="cluar-configuration" rel="stylesheet" href="/root.css">
 </head>
 <body>
  <div class="base-loading__container">
   <div class="base-loading">
    <div></div>
    <div></div>
    <div></div>
   </div>
  </div>
  <div id="root" style="display: none;"></div>
  <script>
    (function () {
      var baseLodingContainer = document.querySelector('.base-loading__container');
      window.addEventListener("DOMContentLoaded", function () {
        baseLodingContainer.remove();
        document.querySelector('#root').style.display = 'block';
      }, false);
    })();
  </script>
  <link href="https://api.tiles.mapbox.com/mapbox-gl-js/v1.8.1/mapbox-gl.css" rel="stylesheet">
  <script type="module" src="/src/main.jsx"></script>
 </body>
</html>
